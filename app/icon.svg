<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background with premium rounded corners -->
  <rect width="256" height="256" rx="52" fill="#0a0a0c"/>

  <!-- Subtle inner glow ring -->
  <rect x="1" y="1" width="254" height="254" rx="51" fill="none" stroke="rgba(16,185,129,0.12)" stroke-width="1"/>

  <!-- Bold geometric V mark -->
